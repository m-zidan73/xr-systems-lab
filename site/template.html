<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{intro}}">
<title>{{title}}</title>
<style>
  /* Each week carries one colour down its edge, the way anodised implants are colour-coded by size. */
  :root {
    color-scheme: light dark;
    --paper: #e9edf0;
    --ink: #15202b;
    --muted: #4c5a67;
    --line: #bac4cd;
    --frame: #3d424d;
    --gold: #8a6200;
    --teal: #0b6e75;
    --magenta: #a0246e;
    --blue: #1f5fbf;
    --drafting: "Bahnschrift", "DIN Alternate", "DIN Next", "Roboto Condensed", "Arial Narrow", sans-serif;
    --voice: "Charter", "Bitstream Charter", "Sitka Text", "Iowan Old Style", Cambria, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1a2027;
      --ink: #e7ecf0;
      --muted: #a3b0bc;
      --line: #37424d;
      --gold: #e4b84a;
      --teal: #4cc9c9;
      --magenta: #f07bb9;
      --blue: #7faef5;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1.0625rem/1.65 var(--voice);
  }
  a { color: inherit; text-underline-offset: .18em; }
  a:hover { color: var(--week, var(--blue)); }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--week, var(--blue)); outline-offset: 3px; }

  .page {
    max-width: 80rem;
    margin: 0 auto;
    padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1rem, 4vw, 3rem) clamp(2.5rem, 6vw, 5rem);
  }

  .masthead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: .5rem 2.5rem;
    align-items: end;
    margin-bottom: clamp(2rem, 5vw, 3.5rem);
  }
  h1 {
    grid-column: 1;
    margin: 0;
    font: 700 clamp(2.75rem, 8vw, 6rem)/.95 var(--drafting);
    letter-spacing: -.015em;
  }
  .intro {
    grid-column: 1;
    margin: 0;
    max-width: 44ch;
    font-size: clamp(1.125rem, 2vw, 1.375rem);
    line-height: 1.4;
  }
  .masthead nav {
    grid-column: 2;
    grid-row: 1 / span 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: .25rem 1.25rem;
    font: 600 1.0625rem/1.5 var(--drafting);
  }

  .week {
    --week: var(--gold);
    border-left: .5rem solid var(--week);
    padding-left: clamp(1rem, 3vw, 2.25rem);
  }
  .week:nth-of-type(4n+2) { --week: var(--teal); }
  .week:nth-of-type(4n+3) { --week: var(--magenta); }
  .week:nth-of-type(4n+4) { --week: var(--blue); }
  .week + .week { margin-top: clamp(3rem, 7vw, 6rem); }
  .week h2 {
    margin: 0 0 clamp(1.25rem, 3vw, 2rem);
    font: 500 clamp(1.5rem, 3.2vw, 2.25rem)/1.15 var(--drafting);
  }
  .week h2 span { color: var(--week); font-weight: 700; margin-right: .35em; }

  .systems { display: grid; gap: clamp(3rem, 6vw, 5.5rem); }
  .system {
    display: grid;
    grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
    gap: clamp(1.25rem, 3vw, 2.75rem);
    align-items: start;
  }
  .system > img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: contain;
    background: var(--frame);
    position: sticky;
    top: 1rem;
  }

  .body > :first-child { margin-top: 0; }
  h3 {
    margin: 0 0 .5rem;
    font: 700 clamp(1.75rem, 3.2vw, 2.5rem)/1.05 var(--drafting);
    letter-spacing: -.01em;
  }
  .pitch { margin: 0 0 .75rem; font-size: 1.1875rem; line-height: 1.4; }
  .tested {
    display: inline-block;
    margin: 0;
    padding: .1rem .55rem;
    border: 1px solid var(--week);
    font: 500 .9375rem/1.5 var(--drafting);
  }
  h4 {
    margin: 1.5rem 0 .2rem;
    font: 600 1.0625rem/1.3 var(--drafting);
    color: var(--week);
  }
  .body p { margin-top: 0; }
  .decisions { margin: 0; padding: 0; list-style: none; }
  .decisions li + li { margin-top: .7rem; }
  .decisions strong { font-weight: 700; }
  .alternative { color: var(--muted); font-style: italic; }

  .disclaimer { margin: 1.25rem 0 0; font-size: .9375rem; line-height: 1.5; color: var(--muted); }
  .assets { margin-top: 1rem; font-size: .9375rem; line-height: 1.5; }
  .assets summary { cursor: pointer; font: 500 .9375rem/1.5 var(--drafting); }
  .assets ul { margin: .4rem 0 0; padding-left: 1.1rem; }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: .25rem 1.25rem;
    margin: 1.25rem 0 .75rem;
    font: 600 1.0625rem/1.5 var(--drafting);
  }
  .credit {
    margin: 0;
    padding-top: .6rem;
    border-top: 1px solid var(--line);
    font-size: .875rem;
    line-height: 1.45;
    color: var(--muted);
  }
  .empty { margin: 0; font: 500 1.5rem/1.3 var(--drafting); color: var(--muted); }

  @media (max-width: 54rem) {
    .system { grid-template-columns: minmax(0, 1fr); }
    .system > img { position: static; }
  }
  @media (max-width: 34rem) {
    .masthead { grid-template-columns: minmax(0, 1fr); }
    .masthead nav { grid-column: 1; grid-row: auto; justify-content: flex-start; margin-top: .5rem; }
    .week { border-left-width: .3rem; }
  }
</style>
</head>
<body>
<div class="page">
<header class="masthead">
<h1>{{title}}</h1>
<p class="intro">{{intro}}</p>
<nav aria-label="Profiles">
{{links}}
</nav>
</header>
<main>
{{weeks}}
</main>
</div>
</body>
</html>
